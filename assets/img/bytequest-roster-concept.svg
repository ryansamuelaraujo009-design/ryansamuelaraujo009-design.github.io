<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="50%" stop-color="#0d121d"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="g1" cx="20%" cy="30%" r="30%"><stop offset="0%" stop-color="rgba(89,232,255,0.12)"/><stop offset="1%" stop-color="rgba(0,0,0,0)"/></radialGradient>
    <radialGradient id="g2" cx="80%" cy="30%" r="30%"><stop offset="0%" stop-color="rgba(255,100,100,0.08)"/><stop offset="1%" stop-color="rgba(0,0,0,0)"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(104,240,255,0.04)"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cardShadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <linearGradient id="skin" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#efd5c2"/><stop offset="100%" stop-color="#d4a98e"/></linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#d9b59e"/><stop offset="100%" stop-color="#b8896e"/></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- Header -->
  <text x="800" y="62" text-anchor="middle" fill="#7af2ff" font-family="Arial,sans-serif" font-size="18" letter-spacing="6" font-weight="700">BYTEQUEST: CRÔNICAS DO NÚCLEO</text>
  <text x="800" y="98" text-anchor="middle" fill="#f4eff2" font-family="Arial,sans-serif" font-size="38" font-weight="800">Mundo Aberto 3D · Personagens Iniciais</text>
  <text x="800" y="126" text-anchor="middle" fill="#95a3b8" font-family="Arial,sans-serif" font-size="15">Escolha seu estilo de jogo e explore um mundo digital corrompido por bugs e vírus</text>

  <!-- RIN - DUELISTA -->
