    <text x="170" y="305" text-anchor="middle" fill="#7ab0ff" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">TANQUE</text>
    <text x="170" y="342" text-anchor="middle" fill="#f4eff2" font-family="Arial,sans-serif" font-size="34" font-weight="800">Siren</text>
    <text x="30" y="385" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Estilo: Defesa e controle de campo</text>
    <text x="30" y="415" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Arma: Martelo + Escudo Firewall</text>
    <text x="30" y="445" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Habilidade: Barreira / Provocar</text>
