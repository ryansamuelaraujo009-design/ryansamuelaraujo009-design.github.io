      <path d="M14 -112 C20 -108,22 -98,18 -88" stroke="#7af2ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M-6 -90 L-2 -90 M2 -90 L6 -90" stroke="#7af2ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    </g>
    <!-- info -->
    <text x="170" y="305" text-anchor="middle" fill="#7af2ff" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DUELISTA</text>
    <text x="170" y="342" text-anchor="middle" fill="#f4eff2" font-family="Arial,sans-serif" font-size="34" font-weight="800">Rin</text>
    <text x="30" y="385" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Estilo: Dano rápido e mobilidade</text>
    <text x="30" y="415" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Arma: Lâmina de Código</text>
    <text x="30" y="445" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Habilidade: Patch Strike / Dash</text>
    <text x="30" y="475" fill="#9aa6bc" font-family="Arial,sans-serif" font-size="13">Ponto forte: Combos e esquiva</text>
    <rect x="30" y="510" width="280" height="1" fill="rgba(255,255,255,0.08)"/>
