    <g transform="translate(30,570)"><rect width="280" height="44" rx="10" fill="rgba(89,232,255,0.1)" stroke="rgba(89,232,255,0.2)"/><text x="140" y="27" text-anchor="middle" fill="#7af2ff" font-family="Arial,sans-serif" font-size="13" font-weight="700">ATAQUE RÁPIDO</text></g>
  </g>

  <!-- SIREN - TANQUE -->
