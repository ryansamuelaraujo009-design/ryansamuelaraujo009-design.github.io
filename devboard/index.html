<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DevBoard - Kanban simples para organizar projetos, tarefas e prazos.">
  <meta name="theme-color" content="#0d0b10">
  <title>DevBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
  <canvas class="code-bg" id="code-bg" aria-hidden="true"></canvas>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6l-4 6 4 6M16 6l4 6-4 6M14 4l-4 16"/></svg>
        </span>
        <div>
          <p class="brand__name">DevBoard</p>
          <p class="brand__sub">Kanban para projetos</p>
        </div>
      </div>
      <div class="topbar__actions">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" class="search__input" type="search" placeholder="Buscar tarefas..." aria-label="Buscar tarefas">
        </div>
        <button class="btn btn--ghost" id="clear-done" type="button">Limpar concluídas</button>
        <button class="btn btn--primary" id="new-task-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nova tarefa
        </button>
      </div>
    </header>

    <main class="main">
      <section class="summary" aria-label="Resumo">
        <div class="stat"><span class="stat__label">Total</span><strong class="stat__value" id="stat-total">0</strong></div>
        <div class="stat"><span class="stat__label">A fazer</span><strong class="stat__value" id="stat-todo">0</strong></div>
        <div class="stat"><span class="stat__label">Fazendo</span><strong class="stat__value" id="stat-doing">0</strong></div>
        <div class="stat"><span class="stat__label">Concluídas</span><strong class="stat__value" id="stat-done">0</strong></div>
      </section>

      <section class="board" aria-label="Quadro Kanban">
        <div class="column" data-col="todo">
          <div class="column__head">
            <div class="column__title"><span class="column__dot column__dot--todo"></span><h2>A fazer</h2><span class="column__count" id="count-todo">0</span></div>
            <button class="icon-btn" data-add="todo" aria-label="Adicionar em A fazer">+</button>
          </div>
          <div class="column__body dropzone" id="col-todo" data-col="todo"></div>
        </div>
        <div class="column" data-col="doing">
          <div class="column__head">
            <div class="column__title"><span class="column__dot column__dot--doing"></span><h2>Fazendo</h2><span class="column__count" id="count-doing">0</span></div>
            <button class="icon-btn" data-add="doing" aria-label="Adicionar em Fazendo">+</button>
          </div>
          <div class="column__body dropzone" id="col-doing" data-col="doing"></div>
        </div>
        <div class="column" data-col="done">
          <div class="column__head">
            <div class="column__title"><span class="column__dot column__dot--done"></span><h2>Concluído</h2><span class="column__count" id="count-done">0</span></div>
            <button class="icon-btn" data-add="done" aria-label="Adicionar em Concluído">+</button>
          </div>
          <div class="column__body dropzone" id="col-done" data-col="done"></div>
        </div>
      </section>
    </main>
  </div>

  <button class="help-fab" id="help-fab" type="button" aria-expanded="false" aria-controls="help-card" title="Ajuda">?</button>
  <aside class="help-card" id="help-card" aria-hidden="true">
    <div class="help-card__head"><strong>Dica rápida</strong><button class="icon-btn" id="help-close" type="button" aria-label="Fechar">×</button></div>
    <p id="help-text" class="help-card__text"></p>
    <button class="btn btn--ghost btn--sm" id="help-next" type="button">Outra dica</button>
  </aside>

  <dialog class="modal" id="task-modal">
    <form class="modal__card" id="task-form" method="dialog">
      <div class="modal__head">
        <h2 id="modal-title">Nova tarefa</h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Fechar">×</button>
      </div>
      <input type="hidden" id="task-id">
      <label class="field"><span>Título</span><input class="input" id="task-title" required maxlength="100" placeholder="Ex.: Criar landing page"></label>
      <label class="field"><span>Descrição</span><textarea class="input" id="task-desc" rows="3" maxlength="280" placeholder="Detalhes, checklist ou contexto..."></textarea></label>
      <div class="form-grid">
        <label class="field"><span>Coluna</span>
          <select class="input" id="task-col">
            <option value="todo">A fazer</option>
            <option value="doing">Fazendo</option>
            <option value="done">Concluído</option>
          </select>
        </label>
        <label class="field"><span>Prioridade</span>
          <select class="input" id="task-priority">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
          </select>
        </label>
        <label class="field"><span>Prazo</span><input class="input" id="task-due" type="date"></label>
        <label class="field"><span>Etiqueta</span><input class="input" id="task-tag" maxlength="24" placeholder="Ex.: Frontend"></label>
      </div>
      <div class="modal__actions">
        <button class="btn btn--ghost" id="task-cancel" type="button">Cancelar</button>
        <button class="btn btn--primary" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" aria-live="polite"></div>
  <script src="js/app.js?v=2"></script>
</body>
</html>
